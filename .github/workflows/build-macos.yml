name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        working-directory: LocalPackage
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LocalPackage-Package \
            -destination "platform=macOS,arch=$(uname -m)" \
            -skipPackagePluginValidation \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/unit-tests.xcresult \
            | xcbeautify

      - name: Build arm64 release
        run: |
          set -o pipefail
          xcodebuild build \
            -project RunCatNeo.xcodeproj \
            -scheme RunCatNeo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | xcbeautify

      - name: Verify and package app
        run: |
          app=DerivedData/Build/Products/Release/RunCatNeo.app
          entitlements=DerivedData/RunCatNeo.entitlements
          codesign --display --entitlements - --xml "$app" > "$entitlements"
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$entitlements" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.get-task-allow' "$entitlements"
          fi
          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - --xml "$app"
          lipo "$app/Contents/MacOS/RunCatNeo" -verify_arch arm64
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" dist/RunCatNeo-macOS-arm64.zip
          cd dist
          shasum -a 256 RunCatNeo-macOS-arm64.zip > SHA256SUMS.txt

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RunCatNeo-macOS-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30
